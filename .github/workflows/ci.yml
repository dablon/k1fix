name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  docker-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: k1fix-dev:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Lint
        run: |
          docker run --rm -v "$PWD:/app" -w /app k1fix-dev:ci bash -lc '
            cargo fmt --all -- --check
            cargo clippy --all-targets -- -D warnings
          '
      - name: Test
        run: docker run --rm -v "$PWD:/app" -w /app k1fix-dev:ci cargo test --tests
      - name: Coverage
        run: |
          docker run --rm -v "$PWD:/app" -w /app k1fix-dev:ci bash -lc '
            rustup component add llvm-tools-preview
            cargo llvm-cov --all-features \
              --ignore-filename-regex "(main\\.rs|examples/)" \
              --fail-under-lines 80 \
              --lcov --output-path lcov.info
          '
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore
      - name: E2E
        run: |
          docker run --rm -v "$PWD:/app" -w /app k1fix-dev:ci bash -lc '
            cargo test --test e2e
          '

  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - run: cargo test
      - run: cargo test --test e2e

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker-ci, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo build --release --bin k1fix
      - uses: softprops/action-gh-release@v2
        with:
          files: target/release/k1fix
