[package]
name = "k1fix"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["k1fix contributors"]
description = "Diagnose, repair and auto-fit 3D meshes for Creality K1 printers"
repository = "https://github.com/k1fix/k1fix"

[lib]
name = "k1fix"
path = "src/lib.rs"

[[bin]]
name = "k1fix"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Production code denies these via `#![cfg_attr(not(test), deny(...))]` in lib.rs.
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
too_many_lines = "warn"
cognitive_complexity = "warn"
doc_markdown = "allow"
wildcard_imports = "allow"
uninlined_format_args = "allow"
redundant_closure_for_method_calls = "allow"
format_push_string = "allow"
float_cmp = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
useless_format = "allow"
manual_let_else = "allow"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
option_if_let_else = "allow"
match_same_arms = "allow"
single_match_else = "allow"
items_after_statements = "allow"
semicolon_if_nothing_returned = "allow"
return_self_not_must_use = "allow"
redundant_else = "allow"
cloned_instead_of_copied = "allow"
manual_midpoint = "allow"
unnecessary_wraps = "allow"
used_underscore_binding = "allow"
ref_option = "allow"
map_unwrap_or = "allow"
or_fun_call = "allow"
filter_map_next = "allow"
stable_sort_primitive = "allow"
implicit_clone = "allow"
assigning_clones = "allow"
manual_memcpy = "allow"
inefficient_to_string = "allow"
large_types_passed_by_value = "allow"
default_trait_access = "allow"
use_self = "allow"
if_not_else = "allow"
match_bool = "allow"
manual_range_contains = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"
needless_continue = "allow"
manual_strip = "allow"
derivable_impls = "allow"
should_implement_trait = "allow"
new_without_default = "allow"
len_without_is_empty = "allow"
write_with_newline = "allow"
println_empty_string = "allow"
single_char_add_str = "allow"
ptr_arg = "allow"
redundant_field_names = "allow"
manual_flatten = "allow"
bind_instead_of_map = "allow"
explicit_iter_loop = "allow"
explicit_into_iter_loop = "allow"
for_kv_map = "allow"
into_iter_without_iter = "allow"
iter_without_into_iter = "allow"
manual_find = "allow"
manual_filter = "allow"
manual_map = "allow"
option_map_unit_fn = "allow"
result_large_err = "allow"
large_enum_variant = "allow"
upper_case_acronyms = "allow"
enum_variant_names = "allow"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nalgebra = "0.33"
owo-colors = "4"
parry3d-f64 = "0.17"
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
stl_io = "0.11"
thiserror = "2"
threemf = "0.8"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
insta = { version = "1", features = ["json"] }
predicates = "3"
proptest = "1"
rstest = "0.23"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
